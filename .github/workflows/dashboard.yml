name: dashboard

# Regenerate the public benchmark dashboard whenever bench results or the
# generator script change, and commit the updated HTML back to the repo so
# GitHub Pages stays current.

on:
  push:
    branches: [main]
    paths:
      - "bench/results/**"
      - "scripts/generate_dashboard.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Regenerate dashboard
        run: python scripts/generate_dashboard.py

      - name: Commit updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/dashboard/index.html
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
          else
            git commit -m "chore(docs): regenerate benchmark dashboard"
            git push
          fi
